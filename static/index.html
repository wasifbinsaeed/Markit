<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarkItDown Converter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      color: #94a3b8;
      margin-top: .4rem;
      font-size: .95rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 1.5rem;
      width: 100%;
      max-width: 860px;
    }

    /* Drop zone */
    #dropzone {
      border: 2px dashed #475569;
      border-radius: .75rem;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      position: relative;
    }
    #dropzone.dragover {
      border-color: #38bdf8;
      background: #0f2d42;
    }
    #dropzone svg { width: 48px; height: 48px; color: #475569; margin-bottom: .75rem; }
    #dropzone p { color: #94a3b8; font-size: .95rem; }
    #dropzone strong { color: #cbd5e1; }
    #dropzone input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }

    .badge-row {
      display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; justify-content: center;
    }
    .badge {
      background: #0f172a; border: 1px solid #334155;
      border-radius: 9999px; padding: .2rem .65rem;
      font-size: .75rem; color: #64748b; font-family: monospace;
    }

    /* Status bar */
    #status {
      margin-top: 1rem;
      min-height: 1.5rem;
      font-size: .875rem;
      text-align: center;
    }
    #status.loading { color: #38bdf8; }
    #status.error   { color: #f87171; }
    #status.success { color: #4ade80; }

    /* Progress */
    #progress-wrap {
      margin-top: .75rem;
      height: 4px;
      background: #334155;
      border-radius: 9999px;
      overflow: hidden;
      display: none;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 9999px;
      transition: width .3s;
    }

    /* Output area */
    #output-section { margin-top: 1.5rem; display: none; }
    #output-section h2 {
      font-size: 1rem; font-weight: 600; color: #cbd5e1; margin-bottom: .75rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    #output-section h2 span { color: #64748b; font-weight: 400; font-size: .85rem; }

    .toolbar {
      display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem;
    }
    button {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .45rem .9rem; border-radius: .5rem; border: none;
      font-size: .85rem; font-weight: 500; cursor: pointer;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    .btn-primary { background: #0ea5e9; color: #fff; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-ghost { background: transparent; border: 1px solid #334155; color: #94a3b8; }

    #md-output {
      width: 100%;
      min-height: 320px;
      max-height: 520px;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: .5rem;
      padding: 1rem;
      font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: .82rem;
      line-height: 1.6;
      resize: vertical;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Stats strip */
    #stats {
      display: flex; gap: 1.5rem; flex-wrap: wrap;
      margin-top: .75rem; color: #64748b; font-size: .8rem;
    }
    #stats span b { color: #94a3b8; }

    /* History */
    #history-section { margin-top: 1.5rem; }
    #history-section h3 { font-size: .875rem; color: #64748b; margin-bottom: .5rem; }
    #history-list { list-style: none; display: flex; flex-direction: column; gap: .35rem; }
    #history-list li {
      background: #0f172a; border: 1px solid #1e293b;
      border-radius: .5rem; padding: .5rem .75rem;
      display: flex; justify-content: space-between; align-items: center;
      font-size: .82rem; cursor: pointer;
      transition: border-color .15s;
    }
    #history-list li:hover { border-color: #38bdf8; }
    #history-list li .meta { color: #64748b; font-size: .75rem; }

    footer {
      margin-top: 2rem; color: #475569; font-size: .8rem; text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>MarkItDown Converter</h1>
  <p>Convert CSV, Excel, PDF, Word, PowerPoint and more to clean Markdown</p>
</header>

<div class="card">

  <!-- Drop zone -->
  <div id="dropzone">
    <input type="file" id="file-input" accept=".csv,.xlsx,.xls,.pdf,.docx,.doc,.pptx,.ppt,.html,.htm,.txt,.json,.xml,.zip" />
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
    </svg>
    <p><strong>Drag &amp; drop</strong> your file here, or click to browse</p>
    <p style="margin-top:.3rem;font-size:.8rem;">Max 50 MB</p>
  </div>

  <div class="badge-row">
    <span class="badge">CSV</span><span class="badge">XLSX</span><span class="badge">XLS</span>
    <span class="badge">PDF</span><span class="badge">DOCX</span><span class="badge">PPTX</span>
    <span class="badge">HTML</span><span class="badge">TXT</span><span class="badge">JSON</span>
    <span class="badge">XML</span><span class="badge">ZIP</span>
  </div>

  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <div id="status"></div>

  <!-- Output -->
  <div id="output-section">
    <h2>Markdown Output <span id="out-filename"></span></h2>
    <div class="toolbar">
      <button class="btn-primary" onclick="downloadMd()">⬇ Download .md</button>
      <button class="btn-secondary" onclick="copyMd()">⎘ Copy</button>
      <button class="btn-ghost" onclick="clearOutput()">✕ Clear</button>
    </div>
    <textarea id="md-output" readonly></textarea>
    <div id="stats"></div>
  </div>

  <!-- History -->
  <div id="history-section" style="display:none">
    <h3>Recent conversions</h3>
    <ul id="history-list"></ul>
  </div>

</div>

<footer>Powered by <a href="https://github.com/microsoft/markitdown" style="color:#38bdf8">microsoft/markitdown</a></footer>

<script>
  const dropzone   = document.getElementById("dropzone");
  const fileInput  = document.getElementById("file-input");
  const statusEl   = document.getElementById("status");
  const progressWrap = document.getElementById("progress-wrap");
  const progressBar  = document.getElementById("progress-bar");
  const outputSection = document.getElementById("output-section");
  const mdOutput   = document.getElementById("md-output");
  const outFilename = document.getElementById("out-filename");
  const statsEl    = document.getElementById("stats");
  const historySection = document.getElementById("history-section");
  const historyList    = document.getElementById("history-list");

  let history = [];
  let currentFilename = "";

  // Drag events
  dropzone.addEventListener("dragover", e => { e.preventDefault(); dropzone.classList.add("dragover"); });
  dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
  dropzone.addEventListener("drop", e => {
    e.preventDefault();
    dropzone.classList.remove("dragover");
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });
  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) handleFile(fileInput.files[0]);
  });

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type;
  }

  function animateProgress() {
    progressWrap.style.display = "block";
    let w = 0;
    const iv = setInterval(() => {
      w = Math.min(w + Math.random() * 8, 88);
      progressBar.style.width = w + "%";
      if (w >= 88) clearInterval(iv);
    }, 120);
    return iv;
  }

  async function handleFile(file) {
    if (file.size > 50 * 1024 * 1024) {
      setStatus("File exceeds 50 MB limit.", "error"); return;
    }
    setStatus(`Converting ${file.name} …`, "loading");
    progressBar.style.width = "0%";
    const iv = animateProgress();

    const form = new FormData();
    form.append("file", file);

    try {
      const res = await fetch("/convert", { method: "POST", body: form });
      clearInterval(iv);
      progressBar.style.width = "100%";
      setTimeout(() => { progressWrap.style.display = "none"; progressBar.style.width = "0%"; }, 600);

      const data = await res.json();
      if (!res.ok || data.error) {
        setStatus("Error: " + (data.error || res.statusText), "error"); return;
      }

      showOutput(data.markdown, data.filename, file.name, file.size);
    } catch (err) {
      clearInterval(iv);
      progressWrap.style.display = "none";
      setStatus("Request failed: " + err.message, "error");
    }
  }

  function showOutput(md, outName, origName, fileSize) {
    mdOutput.value = md;
    currentFilename = outName;
    outFilename.textContent = outName;

    const lines = md.split("\n").length;
    const words = md.split(/\s+/).filter(Boolean).length;
    const chars = md.length;
    statsEl.innerHTML =
      `<span><b>${lines.toLocaleString()}</b> lines</span>` +
      `<span><b>${words.toLocaleString()}</b> words</span>` +
      `<span><b>${chars.toLocaleString()}</b> chars</span>` +
      `<span>source <b>${(fileSize/1024).toFixed(1)} KB</b></span>`;

    outputSection.style.display = "block";
    setStatus(`✓ Converted successfully`, "success");

    addHistory(origName, outName, md);
  }

  function addHistory(origName, outName, md) {
    history.unshift({ origName, outName, md, time: new Date().toLocaleTimeString() });
    if (history.length > 8) history.pop();
    renderHistory();
  }

  function renderHistory() {
    if (history.length < 2) return;
    historySection.style.display = "block";
    historyList.innerHTML = history.map((h, i) =>
      `<li onclick="restoreHistory(${i})">
        <span>${h.origName}</span>
        <span class="meta">${h.time} — ${h.outName}</span>
      </li>`
    ).join("");
  }

  function restoreHistory(i) {
    const h = history[i];
    mdOutput.value = h.md;
    currentFilename = h.outName;
    outFilename.textContent = h.outName;
    outputSection.style.display = "block";
    setStatus(`Restored: ${h.origName}`, "success");
  }

  function downloadMd() {
    const blob = new Blob([mdOutput.value], { type: "text/markdown" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = currentFilename || "output.md";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function copyMd() {
    navigator.clipboard.writeText(mdOutput.value).then(() => {
      setStatus("Copied to clipboard!", "success");
      setTimeout(() => setStatus("", ""), 2000);
    });
  }

  function clearOutput() {
    mdOutput.value = "";
    outputSection.style.display = "none";
    setStatus("", "");
    fileInput.value = "";
  }
</script>
</body>
</html>
